<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a3a"/>
      <stop offset="1" stop-color="#0d4f45"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 76H1200M0 152H1200M0 228H1200M0 304H1200"/>
    <path d="M150 0V380M300 0V380M450 0V380M600 0V380M750 0V380M900 0V380M1050 0V380"/>
  </g>
  <!-- rising step bars (weekly chart) -->
  <g fill="url(#bar)" opacity="0.9">
    <rect x="880" y="250" width="30" height="70" rx="8"/>
    <rect x="922" y="220" width="30" height="100" rx="8"/>
    <rect x="964" y="232" width="30" height="88" rx="8"/>
    <rect x="1006" y="180" width="30" height="140" rx="8"/>
    <rect x="1048" y="150" width="30" height="170" rx="8"/>
    <rect x="1090" y="110" width="30" height="210" rx="8"/>
    <rect x="1132" y="70" width="30" height="250" rx="8"/>
  </g>
  <!-- goal line -->
  <path d="M870 160H1165" stroke="#fde047" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="872" y="150" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#fde047" font-weight="600">GOAL</text>
  <!-- footprints trail -->
  <g fill="#5eead4" opacity="0.35">
    <ellipse cx="90" cy="330" rx="9" ry="15" transform="rotate(-20 90 330)"/>
    <ellipse cx="128" cy="306" rx="9" ry="15" transform="rotate(-20 128 306)"/>
    <ellipse cx="160" cy="330" rx="9" ry="15" transform="rotate(-20 160 330)"/>
    <ellipse cx="198" cy="306" rx="9" ry="15" transform="rotate(-20 198 306)"/>
    <ellipse cx="230" cy="330" rx="9" ry="15" transform="rotate(-20 230 330)"/>
  </g>
  <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="url(#title)" letter-spacing="-2">StrideBoard</text>
  <text x="74" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#e2e8f0" font-weight="500">Every step, every student, every teacher: one live game.</text>
  <text x="74" y="246" font-family="Consolas, Menlo, monospace" font-size="18" fill="#5eead4">Apple Health · Health Connect → POST /api/steps → Flask · SQLite</text>
  <text x="74" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#94a3b8">AL SOUT · The Student Wellbeing Project 2026 · Ras Al Khaimah, UAE</text>
</svg>
